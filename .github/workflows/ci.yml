name: CI Pipeline

# 1. When should this robot run?
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 2. What jobs should it do?
jobs:
  test-and-build:
    name: Run Tests and Build Docker
    runs-on: ubuntu-latest

    # 3. Spin up temporary databases for testing
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_school_db
        ports:
          - 5432:5432
        # Wait for postgres to be ready before moving on
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    # 4. The actual step-by-step instructions
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip" # Makes subsequent runs faster by caching dependencies!

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        # We inject the environment variables here so your code connects to the GitHub Action databases
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_school_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          # If you have a make command like 'make test', you can replace the line below with it!
          pytest -v 

      - name: Test Docker Build (Sanity Check)
        # We just build the image to ensure your Dockerfile isn't broken. We don't push it anywhere yet.
        run: docker build -t student-system-api .
        