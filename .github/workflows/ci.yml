name: CI Pipeline

on:
  push:
    branches: [ "main", "testing-api" ]
  pull_request:
    branches: [ "main", "testing-api" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        # Copilot's fix: Ensures Redis is fully awake before tests start!
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ➡️ THIS IS EXACTLY WHERE IT GOES ⬅️
      - name: Run Tests
        env:
          TESTING: "True"
          SQLALCHEMY_DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0  # This forces your app to use localhost instead of 'redis'
        run: make test

      - name: Docker Build Check
        run: docker build -t student-system-api .