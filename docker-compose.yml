# The master blueprint version
version: '3.8'

# ---------------------------------------------------
# THE RESTAURANT DEPARTMENTS (COMPUTERS)
# ---------------------------------------------------
services:

  # 1. The Head Chef (Your FastAPI Web API)
  api:
    build: .                           # Use the Dockerfile in this folder to train the chef
    ports:
      - "8000:8000"                    # Drive-Thru Window: Connect host port 8000 to internal port 8000
    env_file:
      - .env                           # Give the chef the secret recipes (passwords/keys)
    environment:
      - PYTHONUNBUFFERED=1             # Tell the chef to shout out errors instantly (don't hide logs)
      - REDIS_URL=redis://redis:6379/0 # Direct path to the Redis Bartender
    depends_on:
      - db                             # Don't let the chef start until the clerk and bartender are ready
      - redis

  # 2. The Filing Clerk (The Local Database)
  db:
    image: postgres:15-alpine          # Hire a pre-trained Postgres professional (alpine = lightweight)
    restart: always                    # If the clerk passes out, wake them up immediately
    environment:
      POSTGRES_USER: postgres          # Hardcoded username
      POSTGRES_PASSWORD: root          # Hardcoded password
      POSTGRES_DB: an_phuoc_db         # The name of the main filing cabinet
    ports:
      - "5432:5432"                    # Drive-Thru Window for the database
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Save all files to the indestructible safe!

  # 3. The Speedy Bartender (The Redis Cache & Task Queue)
  redis:
    image: redis:7-alpine              # Hire a pre-trained Redis professional
    ports:
      - "6379:6379"                    # Drive-Thru Window for the cache

  # 4. The Line Cook (The Celery Background Worker) -- [ADDED]
  worker:
    build: .                           # Uses the same Python environment as the API
    command: celery -A core.celery_app worker --loglevel=info  # Starts the Celery process
    env_file:
      - .env                           # Access to DATABASE_URL and secrets
    environment:
      - PYTHONUNBUFFERED=1             # Print logs immediately to console
      - REDIS_URL=redis://redis:6379/0 # Read tasks from the Redis Bartender
    depends_on:
      - db                             # Needs database access to perform heavy queries
      - redis                          # Needs Redis to fetch task tickets

  # 5. The Security Camera Room (Database UI)
  pgadmin:
    image: dpage/pgadmin4              # Hire a pre-trained pgAdmin web viewer
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"                      # Drive-Thru Window: Map laptop port 5050 to internal port 80
    depends_on:
      - db                             # Cameras can't turn on if the database isn't running
    volumes:
      - pgadmin_data:/var/lib/pgadmin  # Save your saved passwords/layouts to a safe

# ---------------------------------------------------
# BUY THE INDESTRUCTIBLE SAFES
# ---------------------------------------------------
volumes:
  postgres_data:                       # Tell Docker to officially manufacture the database safe
  pgadmin_data:                        # Tell Docker to officially manufacture the UI safe